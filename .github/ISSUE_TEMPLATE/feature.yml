name: Proponer una mejora
description: Una idea o función nueva
labels: [mejora]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resolvería?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: ¿Cómo te lo imaginás?
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que consideraste
