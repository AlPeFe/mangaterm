name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar ext-host
        working-directory: ext-host
        run: ./gradlew installDist --no-daemon

      - name: ext-host responde por el protocolo
        run: |
          host=ext-host/build/install/ext-host/bin/ext-host
          [ "$RUNNER_OS" = "Windows" ] && host="$host.bat"
          out=$(echo '{"id":1,"op":"ping"}' | "$host")
          echo "$out"
          echo "$out" | grep -q '"result":"pong"'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reader

      - name: Compilar y testear reader
        working-directory: reader
        env:
          HANTHO_HOME: ${{ runner.temp }}/hantho
        run: |
          cargo build --release
          cargo test --release

      # Depende de sitios externos: informativo, no rompe el build
      - name: Smoke test con red (instalar extensión y buscar)
        continue-on-error: true
        working-directory: reader
        env:
          HANTHO_HOME: ${{ runner.temp }}/hantho
        run: |
          ./target/release/hantho ext repo add https://github.com/keiyoushi/extensions
          ./target/release/hantho ext install mangadex
          ./target/release/hantho search "grand blue"
